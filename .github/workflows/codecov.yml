name: codecov

on: [push, pull_request]

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: fetch
        uses: actions/checkout@v5

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot libgsl-dev libnetcdf-dev libhdf5-dev lcov

      - name: make coverage
        run: |
          cd ./src
          make coverage

      - name: upload
        uses: codecov/codecov-action@v5
        with:
          files: ./src/coverage.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
